[flake8]
# Stated explicitly because CI installed flake8 unpinned, so the gate ran
# against whatever pycodestyle default happened to be current. The default
# max-line-length of 79 has never matched this code (the longest line is 88),
# so `main` carried a red build that no commit caused and no commit could fix.
# 100 is the limit the code was actually written to.
max-line-length = 100
exclude = .git,__pycache__,build,install,log
